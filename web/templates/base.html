<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}나만의 안전신문고{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- DataTables Extensions (KeyTable, AutoFill, Select) -->
    <link href="https://cdn.datatables.net/keytable/2.10.0/css/keyTable.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/autofill/2.6.0/css/autoFill.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/select/1.7.0/css/select.bootstrap5.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; }
        .sidebar { background-color: #343a40; min-height: 100vh; color: white; padding-top: 20px;}
        .sidebar a { color: white; font-weight: bold; text-decoration: none; display: block; padding: 10px 20px;}
        .sidebar a:hover, .sidebar a.active { color: white; background-color: #495057; border-left: 3px solid #0d6efd;}
        .main-content { padding: 20px; }
        .card-custom { box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); border-radius: 0.5rem; border: none; margin-bottom: 20px;}
        .floating-search-btn {
            position: fixed;
            right: 20px;
            bottom: 60px;
            z-index: 1050;
            border-radius: 50px;
            padding: 12px 25px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .floating-search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 d-none d-md-block sidebar">
            <div class="sidebar-sticky">
                <div class="text-center mb-2">
                    <img src="/static/logo.png" alt="Logo" style="width: 80px; height: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
                </div>
                <h5 class="text-center mb-0 text-white fw-bold">나만의<br>안전신문고</h5>
                <div class="text-center text-white fw-bold mb-4" style="font-size: 0.8rem;">프로젝트 버전: v{{ request.state.app_version }}</div>
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}"><i class="fas fa-tachometer-alt me-2"></i>대시보드</a>
                <a href="/crawl" class="{% if request.url.path.startswith('/crawl') %}active{% endif %}"><i class="fas fa-spider me-2"></i>크롤링 제어</a>
                <a href="/rating" class="{% if request.url.path.startswith('/rating') %}active{% endif %}"><i class="fas fa-star text-warning me-2"></i>자동 별점 주기</a>
                <a href="/watchlist" class="{% if request.url.path.startswith('/watchlist') %}active{% endif %}"><i class="fas fa-eye text-danger me-2"></i>감시 목록 관리</a>
                
                <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-white fw-bold">
                  <span>데이터 조회</span>
                </h6>
                <a href="/data/traffic" class="{% if request.url.path == '/data/traffic' %}active{% endif %}"><i class="fas fa-car me-2"></i>교통위반 내역</a>
                <a href="/data/other" class="{% if request.url.path == '/data/other' %}active{% endif %}"><i class="fas fa-exclamation-triangle me-2"></i>기타 위반 조회</a>
                <a href="/data/duplicates" class="{% if request.url.path == '/data/duplicates' %}active{% endif %}"><i class="fas fa-clone me-2"></i>중복차량 내역</a>
                <a href="/stats" class="{% if request.url.path == '/stats' %}active{% endif %}"><i class="fas fa-chart-pie me-2"></i>처리 부서 통계</a>
                
                <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-white fw-bold">
                  <span>기타</span>
                </h6>
                <a href="/file-browser" class="{% if request.url.path.startswith('/file-browser') %}active{% endif %}"><i class="fas fa-folder-open me-2"></i>파일 브라우저</a>
                <a href="/settings" class="{% if request.url.path.startswith('/settings') %}active{% endif %}"><i class="fas fa-cog me-2"></i>설정</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-10 ms-sm-auto px-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">{{ title }}</h1>
            </div>
            
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- DataTables JS & Extensions -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/keytable/2.10.0/js/dataTables.keyTable.min.js"></script>
<script src="https://cdn.datatables.net/autofill/2.6.0/js/dataTables.autoFill.min.js"></script>
<script src="https://cdn.datatables.net/select/1.7.0/js/dataTables.select.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
