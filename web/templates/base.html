<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}나만의 안전신문고{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- DataTables Extensions (KeyTable, AutoFill, Select) -->
    <link href="https://cdn.datatables.net/keytable/2.10.0/css/keyTable.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/autofill/2.6.0/css/autoFill.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/select/1.7.0/css/select.bootstrap5.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Flatpickr (날짜 입력 한국어 표시) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; }
        .sidebar { background-color: #343a40; min-height: 100vh; color: white; padding-top: 20px;}
        .sidebar a { color: white; font-weight: bold; text-decoration: none; display: block; padding: 10px 20px;}
        .sidebar a:hover, .sidebar a.active { color: white; background-color: #495057; border-left: 3px solid #0d6efd;}
        .main-content { padding: 20px; }
        .card-custom { box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); border-radius: 0.5rem; border: none; margin-bottom: 20px;}
        .floating-search-btn {
            position: fixed;
            right: 20px;
            bottom: 60px;
            z-index: 1050;
            border-radius: 50px;
            padding: 12px 25px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .floating-search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .btn-sidebar-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1046;
            border-radius: 8px;
            width: 42px;
            height: 42px;
            font-size: 1.1rem;
            display: none;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1044;
        }
        @media (max-width: 767.98px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: -260px;
                width: 240px;
                height: 100vh;
                z-index: 1045;
                transition: left 0.28s ease;
                overflow-y: auto;
                min-height: unset;
            }
            .sidebar.sidebar-open {
                left: 0;
            }
            .sidebar-overlay.sidebar-open {
                display: block;
            }
            .btn-sidebar-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .main-content {
                padding-top: 56px !important;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- 모바일 사이드바 토글 버튼 -->
        <button class="btn btn-dark btn-sidebar-toggle" id="btnSidebarToggle" aria-label="메뉴">
            <i class="fas fa-bars"></i>
        </button>
        <!-- 모바일 사이드바 오버레이 -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <nav class="col-md-2 d-md-block sidebar" id="mainSidebar">
            <div class="sidebar-sticky">
                <div class="text-center mb-2">
                    <img src="/static/logo.png" alt="Logo" style="width: 80px; height: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
                </div>
                <h5 class="text-center mb-0 text-white fw-bold">나만의<br>안전신문고</h5>
                <div class="text-center text-white fw-bold mb-4" style="font-size: 0.8rem;">프로젝트 버전: v{{ request.state.app_version }}</div>
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}"><i class="fas fa-tachometer-alt fa-fw me-2"></i>대시보드</a>
                <a href="/crawl" class="{% if request.url.path.startswith('/crawl') %}active{% endif %}"><i class="fas fa-spider fa-fw me-2"></i>크롤링 제어</a>
                <a href="/rating" class="{% if request.url.path.startswith('/rating') %}active{% endif %}"><i class="fas fa-star fa-fw text-warning me-2"></i>자동 별점 주기</a>
                <a href="/watchlist" class="{% if request.url.path.startswith('/watchlist') %}active{% endif %}"><i class="fas fa-eye fa-fw text-danger me-2"></i>감시 목록 관리</a>
                
                <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-white fw-bold">
                  <span>데이터 조회</span>
                </h6>
                <a href="/data/traffic" class="{% if request.url.path == '/data/traffic' %}active{% endif %}"><i class="fas fa-car fa-fw me-2"></i>교통위반 내역</a>
                <a href="/data/other" class="{% if request.url.path == '/data/other' %}active{% endif %}"><i class="fas fa-exclamation-triangle fa-fw me-2"></i>기타 위반 조회</a>
                <a href="/data/duplicates" class="{% if request.url.path == '/data/duplicates' %}active{% endif %}"><i class="fas fa-clone fa-fw me-2"></i>중복차량 내역</a>
                <a href="/stats" class="{% if request.url.path == '/stats' %}active{% endif %}"><i class="fas fa-chart-pie fa-fw me-2"></i>처리 부서 통계</a>
                
                <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-white fw-bold">
                  <span>설정</span>
                </h6>
                <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}"><i class="fas fa-cog fa-fw me-2"></i>앱 설정</a>
                <a href="/devices" class="{% if request.url.path.startswith('/devices') %}active{% endif %}"><i class="fas fa-mobile-alt fa-fw me-2"></i>기기 연동</a>
                <a href="/settings/admin" class="{% if request.url.path.startswith('/settings/admin') %}active{% endif %}"><i class="fas fa-user-shield fa-fw me-2"></i>관리자 계정 변경</a>

                <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-4 mb-1 text-white fw-bold">
                  <span>기타</span>
                </h6>
                <a href="/file-browser" class="{% if request.url.path.startswith('/file-browser') %}active{% endif %}"><i class="fas fa-folder-open fa-fw me-2"></i>파일 브라우저</a>
                <a href="https://github.com/Fentanest/safetyreport" target="_blank"><i class="fab fa-github fa-fw me-2"></i>깃허브 저장소</a>
                <a href="https://hb.worklazy.net/mysafetyreport/" target="_blank"><i class="fas fa-blog fa-fw me-2"></i>제작자 블로그</a>
                <a href="/logout" onclick="return confirm('로그아웃 하시겠습니까?');" style="margin-top: auto;"><i class="fas fa-sign-out-alt fa-fw me-2"></i>로그아웃</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-10 ms-sm-auto px-4 main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">{{ title }}</h1>
            </div>
            
            {% block content %}
            {% endblock %}
        </main>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- DataTables JS & Extensions -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/keytable/2.10.0/js/dataTables.keyTable.min.js"></script>
<script src="https://cdn.datatables.net/autofill/2.6.0/js/dataTables.autoFill.min.js"></script>
<script src="https://cdn.datatables.net/select/1.7.0/js/dataTables.select.min.js"></script>
{% block extra_js %}{% endblock %}
<!-- Flatpickr JS + 한국어 로케일 -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    flatpickr('input[type="date"]', {
        locale: 'ko',
        dateFormat: 'Y-m-d',
        allowInput: true
    });
});
</script>
<script>
// 모바일 사이드바 토글
(function() {
    var sidebar = document.getElementById('mainSidebar');
    var overlay = document.getElementById('sidebarOverlay');
    var toggleBtn = document.getElementById('btnSidebarToggle');

    function openSidebar() {
        sidebar.classList.add('sidebar-open');
        overlay.classList.add('sidebar-open');
    }
    function closeSidebar() {
        sidebar.classList.remove('sidebar-open');
        overlay.classList.remove('sidebar-open');
    }

    toggleBtn.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
    // 사이드바 링크 클릭 시 자동 닫기
    sidebar.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', closeSidebar);
    });
})();

// Offcanvas 열릴 때 플로팅 버튼 숨기기
document.addEventListener('show.bs.offcanvas', function() {
    var btn = document.querySelector('.floating-search-btn');
    if (btn) btn.style.visibility = 'hidden';
});
document.addEventListener('hidden.bs.offcanvas', function() {
    var btn = document.querySelector('.floating-search-btn');
    if (btn) btn.style.visibility = '';
});

// 세션 만료(401) 시 로그인 화면으로 이동
(function() {
    var _redirecting = false;
    function handleSessionExpired() {
        if (_redirecting) return;
        _redirecting = true;
        window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
    }

    // fetch 인터셉터
    var _origFetch = window.fetch;
    window.fetch = function() {
        return _origFetch.apply(this, arguments).then(function(response) {
            if (response.status === 401) {
                handleSessionExpired();
            }
            return response;
        });
    };

    // XMLHttpRequest 인터셉터
    var _origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function() {
        this.addEventListener('load', function() {
            if (this.status === 401) {
                handleSessionExpired();
            }
        });
        return _origOpen.apply(this, arguments);
    };
})();

// 안전신문고 링크 클릭 시 첫 TCP 연결 RST 오류 우회
// fetch로 도메인 연결을 먼저 워밍업한 뒤 탭을 엽니다.
document.addEventListener('click', function(e) {
    var anchor = e.target.closest('a[target="_blank"]');
    if (!anchor) return;
    var href = anchor.getAttribute('href') || '';
    if (!href.includes('safetyreport.go.kr')) return;

    e.preventDefault();
    fetch('https://www.safetyreport.go.kr/', { mode: 'no-cors', cache: 'no-store' })
        .catch(function() {})
        .finally(function() {
            window.open(href, '_blank');
        });
});
</script>
</body>
</html>
