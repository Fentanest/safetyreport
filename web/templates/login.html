<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 나만의 안전신문고</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-area img {
            width: 70px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-8 col-lg-5">
            <div class="card login-card">
                <div class="card-body p-4 p-md-5">
                    <div class="logo-area">
                        <img src="/static/logo.png" alt="Logo">
                        <h4 class="fw-bold mb-0">나만의 안전신문고</h4>
                        <p class="text-muted small">관리자 로그인</p>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
                    {% endif %}

                    {% if next %}
                    <div class="alert alert-info py-2 small" role="alert">
                        <i class="bi bi-info-circle me-1"></i>세션이 만료되었습니다. 다시 로그인해 주세요.
                    </div>
                    {% endif %}

                    <form method="post" action="/login">
                        <input type="hidden" name="next" value="{{ next or '' }}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">아이디</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   autocomplete="username" autofocus required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold">비밀번호</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   autocomplete="current-password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">로그인</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
