{# 테마 공통 머리: 첫 paint 전에 저장값/시스템 설정을 <html data-bs-theme> 에 적용해 깜빡임을 막는다. base/login/setup 공용. #}
<script>
(function () {
    var choice = 'system';
    try { choice = localStorage.getItem('sr-theme') || 'system'; } catch (e) {}
    var dark = choice === 'dark' || (choice === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-sr-theme-choice', choice);
})();
</script>
