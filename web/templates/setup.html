<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초기 설정 - 나만의 안전신문고</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v={{ request.state.app_version }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .setup-card {
            width: 100%;
            max-width: 440px;
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.1);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-area img {
            width: 70px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-8 col-lg-6">
            <div class="card setup-card">
                <div class="card-body p-4 p-md-5">
                    <div class="logo-area">
                        <img src="/static/logo.png?v={{ request.state.app_version }}" alt="Logo">
                        <h4 class="fw-bold mb-0">나만의 안전신문고</h4>
                        <p class="text-muted small">최초 실행 - 관리자 계정 설정</p>
                    </div>

                    <div class="alert alert-info small py-2" role="alert">
                        프로그램을 관리할 <strong>관리자 계정</strong>을 생성합니다.<br>
                        이 계정은 안전신문고 로그인과 별개입니다.
                    </div>

                    {% if error %}
                    <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
                    {% endif %}

                    <form method="post" action="/setup">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">아이디</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   autocomplete="username" autofocus required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">비밀번호</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   autocomplete="new-password" required>
                            <div class="form-text">4자 이상 입력해주세요.</div>
                        </div>
                        <div class="mb-4">
                            <label for="password_confirm" class="form-label fw-bold">비밀번호 확인</label>
                            <input type="password" class="form-control" id="password_confirm" name="password_confirm"
                                   autocomplete="new-password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">관리자 계정 생성</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
