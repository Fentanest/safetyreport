{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <div class="card card-custom">
            <div class="card-header bg-white fw-bold">자동 별점(만족도 조사) 매크로 제어</div>
            <div class="card-body">
                <form id="ratingForm" class="row align-items-center">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-primary fw-bold">별점 대상 신고번호 또는 고유 ID 입력</label>
                        <p class="text-muted small mb-2">하단 표에서 행을 클릭하거나, 대상의 신고번호(예: SPP-...)나 ID를 여러 줄로 직접 입력하세요.</p>
                        <textarea class="form-control" name="ids" id="ratingIds" rows="4"
                            placeholder="SPP-..."></textarea>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label text-success fw-bold">부여할 별점(1~5점)</label>
                        <select class="form-select" name="score" id="ratingScore">
                            <option value="5" selected>5점 (매우 만족)</option>
                            <option value="4">4점 (만족)</option>
                            <option value="3">3점 (보통)</option>
                            <option value="2">2점 (불만족)</option>
                            <option value="1">1점 (매우 불만족)</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3 d-flex flex-column align-items-end justify-content-end"
                        style="height: 100%;">
                        <button type="submit" class="btn btn-warning w-100" id="btnStartRating"
                            style="height: 60px; font-weight: bold; font-size: 1.1em;">
                            <i class="fas fa-star me-2"></i> 선택 건 별점 처리 시작
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Live Logs Card -->
<div class="row mb-4" id="rowLogs">
    <div class="col-md-12">
        <div class="card card-custom h-100">
            <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                <span><i class="fas fa-terminal me-2"></i> 별점 처리 실시간 진행 모니터링</span>
                <span id="ratingStatus" class="badge bg-secondary">대기 중</span>
            </div>
            <div class="card-body p-0 d-flex flex-column" style="background-color: #1e1e1e; height: 350px;">
                <div id="ratingLogConsole"
                    style="flex-grow: 1; overflow-y: auto; padding: 15px; color: #00ff00; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.9em; white-space: pre-wrap;">
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card card-custom">
    <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
        <span><i class="fas fa-list"></i> 만족도조사 미참여 대상 </span>
    </div>
    <div class="card-body">
        <h6 class="fw-bold mb-3">만족도조사 참여 가능 신고건</h6>
        <!-- Advanced Search Form -->
        <form class="row g-3 mb-4" id="ratingSearchForm">
            <div class="col-md-3">
                <label class="form-label">처리기관</label>
                <input type="text" class="form-control form-control-sm" id="sAgency">
            </div>
            <div class="col-md-3">
                <label class="form-label">담당자</label>
                <input type="text" class="form-control form-control-sm" id="sPerson">
            </div>
            <div class="col-md-3">
                <label class="form-label">처리상태</label>
                <input type="text" class="form-control form-control-sm" id="sStatus">
            </div>
            <div class="col-md-3">
                <label class="form-label">과태료/범칙금</label>
                <input type="text" class="form-control form-control-sm" id="sFine">
            </div>
            <div class="col-12 text-end">
                <button type="button" class="btn btn-sm btn-secondary me-2" id="btnAutoFill"><i
                        class="fas fa-magic me-1"></i>검색 결과 자동 입력</button>
                <button type="button" class="btn btn-sm btn-primary" id="btnRatingSearch">표에서 검색</button>
            </div>
        </form>

        <table id="ratingTable" class="table table-striped table-hover table-bordered" style="width:100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>신고번호</th>
                    <th>신고명</th>
                    <th>신고일</th>
                    <th>처리기관</th>
                    <th>담당자</th>
                    <th>처리상태</th>
                    <th>과태료/범칙금</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
<!-- Cell Content Modal -->
<div class="modal fade" id="cellModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h6 class="modal-title" id="cellModalLabel"></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="cellModalContent" class="mb-0" style="word-break: break-all; white-space: pre-wrap;"></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<style>
    #ratingTable td {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 0;
    }
</style>
<script>
    var _ratingData = {{ records | tojson }};
</script>
<script>
    $(document).ready(function () {
        function esc(s) {
            if (s == null) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function renderBadge(status) {
            if (!status) return '';
            var cls = 'bg-light text-dark border';
            if (status === '수용') cls = 'bg-success';
            else if (status === '불수용' || status === '기타') cls = 'bg-danger';
            else if (status === '취하') cls = 'bg-secondary text-white';
            else if (status === '일부수용') cls = 'bg-warning text-dark';
            else if (status === '처리중') cls = 'bg-primary';
            return '<span class="badge ' + cls + '">' + esc(status) + '</span>';
        }

        var table = $('#ratingTable').DataTable({
            data: _ratingData,
            deferRender: true,
            processing: true,
            columns: [
                { data: 'ID' },
                {
                    data: '신고번호', render: function (v, t, row) {
                        if (t === 'display') return '<a href="https://www.safetyreport.go.kr/#mypage/mysafereport/' + esc(row['ID']) + '" target="_blank">' + esc(v) + '</a>';
                        return v == null ? '' : String(v);
                    }
                },
                { data: '신고명', defaultContent: '' },
                { data: '신고일', defaultContent: '' },
                { data: '처리기관', defaultContent: '' },
                { data: '담당자', defaultContent: '' },
                {
                    data: '처리상태', render: function (v, t) {
                        return t === 'display' ? renderBadge(v) : (v == null ? '' : String(v));
                    }
                },
                { data: '범칙금_과태료', defaultContent: '' }
            ],
            scrollX: true,
            autoWidth: false,
            pageLength: 50,
            order: [[1, "desc"]],
            language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/ko.json' },
            columnDefs: [
                { targets: '_all', className: 'text-center', createdCell: function(td, cellData) {
                    var text = cellData == null ? '' : String(cellData);
                    $(td).attr('title', text);
                }},
                { targets: 0, width: '40.89px' },
                { targets: 1, width: '90px' },
                { targets: 2, width: '140px' },
                { targets: 3, width: '85px' },
                { targets: 4, width: '190px' },
                { targets: 5, width: '50px' },
                { targets: 6, width: '50px' },
                { targets: 7, width: '100px' }
            ]
        });

        const logConsole = document.getElementById('ratingLogConsole');
        let ws = null;

        function connectRatingWs() {
            if (ws && ws.readyState !== WebSocket.CLOSED) { return; }
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/rating/ws/rating_logs`);

            ws.onmessage = function (event) {
                logConsole.textContent += event.data;
                logConsole.scrollTop = logConsole.scrollHeight;

                if (event.data.includes("처리가 종료되었습니다")) {
                    $('#ratingStatus').removeClass('bg-success').addClass('bg-secondary').text('대기 중/종료됨');
                } else if (event.data.includes("작업 로그 시작") || event.data.includes("처리 중")) {
                    $('#ratingStatus').removeClass('bg-secondary').addClass('bg-success').text('진행 중');
                }
            };
        }

        // Initial connection
        connectRatingWs();

        $('#btnRatingSearch').on('click', function () {
            table.column(4).search($('#sAgency').val()); // 처리기관
            table.column(5).search($('#sPerson').val()); // 담당자
            table.column(6).search($('#sStatus').val()); // 처리상태
            table.column(7).search($('#sFine').val());  // 범칙금_과태료
            table.draw();
        });

        $('#ratingSearchForm input').on('keypress', function (e) {
            if (e.which === 13) {
                e.preventDefault();
                $('#btnRatingSearch').click();
            }
        });

        $('#btnAutoFill').on('click', function () {
            var rnums = [];
            table.rows({ search: 'applied' }).every(function () {
                var data = this.data();
                if (data && data['ID']) {
                    rnums.push(data['ID']);
                }
            });
            if (rnums.length > 0) {
                var current_val = $('#ratingIds').val().trim();
                var newVal = current_val ? current_val + '\n' + rnums.join('\n') : rnums.join('\n');

                // Remove duplicates
                var uniqueArr = [...new Set(newVal.split('\n'))];
                $('#ratingIds').val(uniqueArr.join('\n'));

                alert(rnums.length + '건의 ID를 입력창에 추가했습니다.');
            } else {
                alert('현재 검색된 결과가 없습니다.');
            }
        });

        $('#ratingForm').on('submit', function (e) {
            e.preventDefault();
            var ids = $('#ratingIds').val().trim();
            if (!ids) {
                alert('별점을 부여할 대상(ID 또는 신고번호)을 먼저 입력하세요.');
                return;
            }
            var score = $('#ratingScore').val();

            if (confirm(`선택하신 건들에 무조건 ${score}점으로 평가를 제출합니다.\n크롤링이 진행 중이지 않을 때만 계속 진행하십시오.\n계속하시겠습니까?`)) {
                $('#btnStartRating').prop('disabled', true);
                logConsole.textContent = ""; // Clear for new job
                $('#ratingStatus').removeClass('bg-secondary').addClass('bg-success').text('요청 중...');

                $.post('/rating/start', { ids: ids, score: parseInt(score) }, function (response) {
                    alert(response.message);
                    $('#btnStartRating').prop('disabled', false);
                    // WebSocket is already connected or will reconnect
                    if (!ws || ws.readyState === WebSocket.CLOSED) connectRatingWs();
                }).fail(function () {
                    alert("요청 중 오류 발생. 백그라운드 스레드 및 웹소켓 로그를 확인하세요.");
                    $('#btnStartRating').prop('disabled', false);
                });
            }
        });

        // Option: click table row to auto-add ID to textarea
        $('#ratingTable tbody').on('click', 'tr', function (e) {
            if ($(e.target).is('a')) return; // Ignore link clicks
            var data = table.row(this).data();
            if (data) {
                var rnum = String(data['신고번호'] || '');
                var current_val = $('#ratingIds').val().trim();
                if (current_val.indexOf(rnum) === -1) {
                    if (current_val.length > 0) $('#ratingIds').val(current_val + '\n' + rnum);
                    else $('#ratingIds').val(rnum);
                }
            }
        });
        $('#ratingTable tbody').css('cursor', 'pointer');

        // Double-click to show full cell content in modal
        var _cellModal = new bootstrap.Modal(document.getElementById('cellModal'));
        $('#ratingTable tbody').on('dblclick', 'td', function(e) {
            e.stopPropagation();
            var colIdx = $(this).index();
            var colName = $('#ratingTable thead th').eq(colIdx).text().trim();
            var text = $(this).attr('title') || $(this).text().trim();
            $('#cellModalLabel').text(colName);
            $('#cellModalContent').text(text);
            _cellModal.show();
        });
    });
</script>
{% endblock %}
