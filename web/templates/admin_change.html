{% extends "base.html" %}

{% block content %}

{% if admin_error %}
<div class="alert alert-danger alert-dismissible fade show" role="alert">
    {{ admin_error }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endif %}
{% if admin_success %}
<div class="alert alert-success alert-dismissible fade show" role="alert">
    {{ admin_success }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endif %}

<div class="row">
    <div class="col-md-5">
        <div class="card card-custom">
            <div class="card-header bg-white fw-bold"><i class="fas fa-user-shield me-2"></i>관리자 계정 변경</div>
            <div class="card-body">
                <p class="text-muted small mb-3">현재 계정: <strong>{{ admin_username }}</strong></p>
                <form method="post" action="/change-admin">
                    <input type="hidden" name="redirect_to" value="/settings/admin">
                    <div class="mb-3">
                        <label class="form-label">새 아이디</label>
                        <input type="text" class="form-control" name="new_username"
                               value="{{ admin_username }}" autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">현재 비밀번호</label>
                        <input type="password" class="form-control" name="current_password"
                               autocomplete="current-password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">새 비밀번호 <span class="text-muted small">(4자 이상)</span></label>
                        <input type="password" class="form-control" name="new_password"
                               autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-warning">변경</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    if (window.location.search.includes('admin_success')) {
        // 성공 메시지는 alert로 표시하지 않고 인라인으로만
    }
</script>

{% endblock %}
