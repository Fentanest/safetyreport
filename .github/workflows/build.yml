name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # ────────────────────────────────────────────────────────────────
  # 0. 릴리즈 메타데이터 준비
  # ────────────────────────────────────────────────────────────────
  prepare-release:
    runs-on: [self-hosted, Linux, X64, 235]
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      tag_exists: ${{ steps.check_tag.outputs.tag_exists }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Read version from VERSION file
      id: get_version
      run: |
        versionString=$(cat VERSION | tr -d '[:space:]')
        if [ -z "$versionString" ]; then
          echo "::error::VERSION 파일에서 버전을 읽을 수 없습니다."
          exit 1
        fi
        echo "version=$versionString" >> "$GITHUB_OUTPUT"
        echo "tag=v$versionString" >> "$GITHUB_OUTPUT"
        echo "Detected version: $versionString, tag: v$versionString"

    - name: Check if tag already exists
      id: check_tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.get_version.outputs.tag }}
      run: |
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG")
        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG already exists. Skipping release workflow."
        elif [ "$HTTP_STATUS" -eq 404 ]; then
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG does not exist. Proceeding with build."
        else
          echo "::error::API call failed with status: $HTTP_STATUS"
          exit 1
        fi

  # ────────────────────────────────────────────────────────────────
  # 1. Windows 실행 파일 빌드 (Git-Windows 셀프호스트 러너)
  # ────────────────────────────────────────────────────────────────
  build-windows:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag_exists == 'false'
    runs-on: [self-hosted, Windows, X64, 233]
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Clean previous build artifacts
      shell: powershell
      run: Remove-Item -Path "venv","build","dist" -Recurse -Force -ErrorAction SilentlyContinue

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Create virtual environment and install dependencies
      shell: powershell
      run: |
        python -m venv venv
        .\venv\Scripts\python.exe -m pip install --no-cache-dir --upgrade pip
        .\venv\Scripts\pip.exe install --no-cache-dir -r requirements.txt
        .\venv\Scripts\pip.exe install --no-cache-dir pyinstaller

    - name: Setup UPX 5.1.1
      id: setup_upx
      shell: powershell
      run: |
        $version = "5.1.1"
        $upxExtractDir = "${env:TEMP}\upx"
        $upxDir = Join-Path $upxExtractDir "upx-${version}-win64"
        $upxPath = Join-Path $upxDir "upx.exe"
        $zipPath = "${env:TEMP}\upx-${version}-win64.zip"
        $downloadUrl = "https://github.com/upx/upx/releases/download/v${version}/upx-${version}-win64.zip"

        if (-not (Test-Path $upxPath)) {
          if (Test-Path $upxExtractDir) { Remove-Item -Recurse -Force $upxExtractDir }
          Write-Output "Downloading UPX $version from $downloadUrl"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $upxExtractDir -Force
        }
        if (-not (Test-Path $upxPath)) {
          Write-Error "UPX executable not found at $upxPath."
          exit 1
        }
        Write-Output "Found UPX at: $upxPath"
        echo "upx_path=$upxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Build Windows executable with PyInstaller
      shell: powershell
      run: .\venv\Scripts\python.exe scripts/build/build_exe.py

    - name: Compress executable with UPX
      shell: powershell
      run: |
        & "${{ steps.setup_upx.outputs.upx_path }}" --best --lzma --force dist/mysafetyreport/mysafetyreport.exe

    - name: Package Windows into Zip
      shell: powershell
      run: Compress-Archive -Path ./dist/mysafetyreport/* -DestinationPath mysafetyreport-win.zip

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-win-${{ needs.prepare-release.outputs.version }}
        path: mysafetyreport-win.zip

  # ────────────────────────────────────────────────────────────────
  # 2. Linux 실행 파일 빌드
  # ────────────────────────────────────────────────────────────────
  build-linux:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag_exists == 'false'
    runs-on: [self-hosted, Linux, X64, 235]
    permissions:
      contents: write
      packages: write

    steps:
    - name: Fix workspace permissions
      run: sudo chown -R $(id -u):$(id -g) . || true

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # ── Linux 실행 파일 빌드 ──────────────────────────────────────
    - name: Clean previous build artifacts
      run: rm -rf venv build dist

    - name: Set up Python 3.14 (local install)
      run: |
        PYTHON=$(command -v python3.14 || command -v python3)
        $PYTHON --version
        echo "$(dirname $PYTHON)" >> $GITHUB_PATH

    - name: Create virtual environment and install dependencies
      run: |
        python3.14 -m venv venv
        ./venv/bin/python -m pip install --no-cache-dir --upgrade pip
        ./venv/bin/pip install --no-cache-dir -r requirements.txt
        ./venv/bin/pip install --no-cache-dir pyinstaller

    - name: Setup UPX 5.1.1
      id: setup_upx
      run: |
        VERSION="5.1.1"
        UPX_DIR="/tmp/upx-${VERSION}-amd64_linux"
        UPX_PATH="${UPX_DIR}/upx"
        TAR_PATH="/tmp/upx.tar.xz"
        DOWNLOAD_URL="https://github.com/upx/upx/releases/download/v${VERSION}/upx-${VERSION}-amd64_linux.tar.xz"

        if [ ! -f "$UPX_PATH" ]; then
          rm -rf "$UPX_DIR"
          echo "Downloading UPX $VERSION from $DOWNLOAD_URL"
          wget -q -O "$TAR_PATH" "$DOWNLOAD_URL"
          mkdir -p "$UPX_DIR"
          tar -xf "$TAR_PATH" -C "$UPX_DIR" --strip-components=1
        fi
        if [ ! -f "$UPX_PATH" ]; then
          echo "::error::UPX executable not found at $UPX_PATH."
          exit 1
        fi
        echo "Found UPX at: $UPX_PATH"
        echo "upx_path=$UPX_PATH" >> "$GITHUB_OUTPUT"

    - name: Build Linux executable with PyInstaller
      run: ./venv/bin/python scripts/build/build_exe.py

    - name: Compress Linux executable with UPX
      run: |
        "${{ steps.setup_upx.outputs.upx_path }}" --best --lzma --force dist/mysafetyreport/mysafetyreport

    - name: Package Linux into Zip
      run: |
        cd dist/mysafetyreport
        zip -r ../../mysafetyreport-linux.zip .

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-linux-${{ needs.prepare-release.outputs.version }}
        path: mysafetyreport-linux.zip

  # ────────────────────────────────────────────────────────────────
  # 3. Docker 멀티아키 이미지 빌드
  # ────────────────────────────────────────────────────────────────
  build-docker:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag_exists == 'false'
    runs-on: [self-hosted, Linux, X64, 234]
    permissions:
      contents: write
      packages: write

    steps:
    - name: Fix workspace permissions
      run: sudo chown -R $(id -u):$(id -g) . || true

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set lowercase image name
      run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker-container
        use: true

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image (amd64 + arm64)
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ env.IMAGE_REPO }}:${{ needs.prepare-release.outputs.version }}
          ghcr.io/${{ env.IMAGE_REPO }}:latest
          fentanest/safetyreport:${{ needs.prepare-release.outputs.version }}
          fentanest/safetyreport:latest
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}

  # ────────────────────────────────────────────────────────────────
  # 3. macOS x64 실행 파일 빌드 (self-hosted Intel runner)
  # ────────────────────────────────────────────────────────────────
  build-macos-x64:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag_exists == 'false'
    runs-on: [self-hosted, macOS, X64, 236]
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Clean previous build artifacts
      run: rm -rf venv build dist

    - name: Check Xcode Command Line Tools
      env:
        MACOS_DEVELOPER_DIR: ${{ vars.MACOS_DEVELOPER_DIR }}
      run: |
        set -euo pipefail

        if [ -n "${MACOS_DEVELOPER_DIR:-}" ]; then
          echo "DEVELOPER_DIR=$MACOS_DEVELOPER_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$MACOS_DEVELOPER_DIR"
        fi

        if ! DEV_PATH=$(xcode-select -p 2>/dev/null); then
          echo "::error::Xcode Command Line Tools를 찾지 못했습니다."
          echo "::error::self-hosted macOS runner에서 'xcode-select --install' 또는 전체 Xcode 설치 후 'sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer' 를 실행하세요."
          echo "::error::별도 위치의 Xcode를 쓰는 경우 GitHub repository variable 'MACOS_DEVELOPER_DIR' 에 '/Applications/Xcode.app/Contents/Developer' 같은 경로를 지정할 수 있습니다."
          exit 1
        fi

        echo "Using developer tools: $DEV_PATH"

        if ! xcrun --find lipo >/dev/null 2>&1; then
          echo "::error::developer tools 안에서 'lipo' 를 찾지 못했습니다. Xcode/Command Line Tools 설치 상태를 확인하세요."
          exit 1
        fi

    - name: Resolve local Python 3.14
      id: python
      env:
        MACOS_X64_PYTHON: ${{ vars.MACOS_X64_PYTHON }}
      run: |
        set -euo pipefail

        CANDIDATES=()
        if [ -n "${MACOS_X64_PYTHON:-}" ]; then
          CANDIDATES+=("$MACOS_X64_PYTHON")
        fi
        CANDIDATES+=(
          "/Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14"
          "/usr/local/bin/python3.14"
          "/opt/homebrew/bin/python3.14"
        )

        FOUND=""
        for candidate in "${CANDIDATES[@]}"; do
          if [ -x "$candidate" ]; then
            FOUND="$candidate"
            break
          fi
        done

        if [ -z "$FOUND" ]; then
          echo "::error::Python 3.14 실행 파일을 찾지 못했습니다."
          echo "::error::self-hosted macOS runner에 Python 3.14를 설치하고, 필요하면 GitHub repository variable 'MACOS_X64_PYTHON' 에 경로를 지정하세요."
          exit 1
        fi

        PYTHON_BIN="$FOUND"
        PYTHON_VERSION=$("$PYTHON_BIN" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
        ARCHS=$(lipo -archs "$PYTHON_BIN")
        echo "Using Python: $PYTHON_BIN"
        echo "Version: $PYTHON_VERSION"
        echo "Architectures: $ARCHS"

        case "$PYTHON_VERSION" in
          3.14.*)
            ;;
          *)
            echo "::error::Python 3.14가 필요하지만 현재 버전은 $PYTHON_VERSION 입니다."
            exit 1
            ;;
        esac

        case "$ARCHS" in
          *x86_64*)
            ;;
          *)
            echo "::error::선택한 Python에 x86_64 아키텍처가 없습니다: $ARCHS"
            exit 1
            ;;
        esac

        echo "python_bin=$PYTHON_BIN" >> "$GITHUB_OUTPUT"

    - name: Ensure OpenSSL and pkg-config for native wheel builds (x86_64 Homebrew)
      run: |
        set -euo pipefail

        # x86_64 빌드이므로 x86_64 Homebrew(/usr/local)의 openssl 을 써야 한다.
        # (Apple Silicon 의 /opt/homebrew arm64 openssl 로 링크하면 x86_64 크레이트 빌드가 깨진다.)
        BREW_BIN="/usr/local/bin/brew"
        if [ ! -x "$BREW_BIN" ]; then
          if command -v brew >/dev/null 2>&1; then
            BREW_BIN="$(command -v brew)"
          else
            echo "::error::x86_64 Homebrew(/usr/local/bin/brew)를 찾지 못했습니다. self-hosted runner 에 Homebrew 설치 후 다시 실행하세요."
            exit 1
          fi
        fi

        # cryptography(openssl-sys/pyo3) 소스 빌드에 필요한 pkg-config/openssl 준비 (이미 있으면 no-op)
        "$BREW_BIN" list pkgconf   >/dev/null 2>&1 || "$BREW_BIN" install pkgconf
        "$BREW_BIN" list openssl@3 >/dev/null 2>&1 || "$BREW_BIN" install openssl@3

        BREW_PREFIX="$("$BREW_BIN" --prefix)"
        OPENSSL_PREFIX="$("$BREW_BIN" --prefix openssl@3)"

        # 후속 스텝(pip install)이 openssl 을 찾도록 환경 전달.
        # OPENSSL_DIR 만 있어도 openssl-sys 는 pkg-config 없이 빌드 가능하고,
        # PATH/PKG_CONFIG_PATH 는 pkg-config 경로까지 함께 열어주는 보강이다.
        {
          echo "PATH=$BREW_PREFIX/bin:$PATH"
          echo "OPENSSL_DIR=$OPENSSL_PREFIX"
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig"
        } >> "$GITHUB_ENV"

        echo "Homebrew prefix : $BREW_PREFIX"
        echo "OpenSSL prefix  : $OPENSSL_PREFIX"
        "$BREW_PREFIX/bin/pkg-config" --version

    - name: Create virtual environment and install dependencies
      run: |
        "${{ steps.python.outputs.python_bin }}" -m venv venv
        ./venv/bin/python -m pip install --no-cache-dir --upgrade pip
        ./venv/bin/pip install --no-cache-dir -r requirements.txt
        ./venv/bin/pip install --no-cache-dir pyinstaller

    - name: Diagnose macOS x64 Python environment
      run: |
        ./venv/bin/python scripts/build/check_macos_universal2.py \
          --root venv \
          --expected-arch x86_64 \
          --fail-if-empty

    - name: Build macOS x64 executable with PyInstaller
      env:
        PYINSTALLER_TARGET_ARCH: x86_64
      run: ./venv/bin/python scripts/build/build_exe.py

    - name: Diagnose macOS x64 bundle
      run: |
        ./venv/bin/python scripts/build/check_macos_universal2.py \
          --root dist/mysafetyreport \
          --expected-arch x86_64 \
          --fail-if-empty

    - name: Package macOS x64 into Zip
      run: |
        cd dist/mysafetyreport
        zip -r ../../mysafetyreport-macos-x64.zip .

    - name: Upload macOS x64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-macos-x64-${{ needs.prepare-release.outputs.version }}
        path: mysafetyreport-macos-x64.zip

  # ────────────────────────────────────────────────────────────────
  # 4. macOS ARM64 실행 파일 빌드 (GitHub-hosted Apple Silicon runner)
  # ────────────────────────────────────────────────────────────────
  build-macos-arm64:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag_exists == 'false'
    runs-on: macos-15
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Clean previous build artifacts
      run: rm -rf venv build dist

    - name: Check Xcode Command Line Tools
      run: |
        set -euo pipefail

        DEV_PATH=$(xcode-select -p)
        echo "Using developer tools: $DEV_PATH"

        if ! xcrun --find lipo >/dev/null 2>&1; then
          echo "::error::developer tools 안에서 'lipo' 를 찾지 못했습니다."
          exit 1
        fi

    - name: Set up Python 3.14 (arm64)
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        architecture: 'arm64'

    - name: Display Python runtime information
      run: |
        set -euo pipefail
        python -c 'import platform, sys; print("Python:", sys.version); print("Machine:", platform.machine()); print("Executable:", sys.executable)'
        file "$(python -c 'import sys; print(sys.executable)')"
        lipo -archs "$(python -c 'import sys; print(sys.executable)')"

    - name: Create virtual environment and install dependencies
      run: |
        python -m venv venv
        ./venv/bin/python -m pip install --no-cache-dir --upgrade pip
        ./venv/bin/pip install --no-cache-dir -r requirements.txt
        ./venv/bin/pip install --no-cache-dir pyinstaller

    - name: Diagnose macOS arm64 Python environment
      run: |
        ./venv/bin/python scripts/build/check_macos_universal2.py \
          --root venv \
          --expected-arch arm64 \
          --fail-if-empty

    - name: Build macOS arm64 executable with PyInstaller
      env:
        PYINSTALLER_TARGET_ARCH: arm64
      run: ./venv/bin/python scripts/build/build_exe.py

    - name: Diagnose macOS arm64 bundle
      run: |
        ./venv/bin/python scripts/build/check_macos_universal2.py \
          --root dist/mysafetyreport \
          --expected-arch arm64 \
          --fail-if-empty

    - name: Package macOS arm64 into Zip
      run: |
        cd dist/mysafetyreport
        zip -r ../../mysafetyreport-macos-arm64.zip .

    - name: Upload macOS arm64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: mysafetyreport-macos-arm64-${{ needs.prepare-release.outputs.version }}
        path: mysafetyreport-macos-arm64.zip

  # ────────────────────────────────────────────────────────────────
  # 5. 공통 릴리즈 생성
  # ────────────────────────────────────────────────────────────────
  create-release:
    needs: [prepare-release, build-windows, build-linux, build-macos-x64, build-macos-arm64]
    if: needs.prepare-release.outputs.tag_exists == 'false'
    runs-on: [self-hosted, Linux, X64, 235]
    permissions:
      contents: write

    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v5
      with:
        name: mysafetyreport-win-${{ needs.prepare-release.outputs.version }}
        path: release-assets/windows

    - name: Download Linux artifact
      uses: actions/download-artifact@v5
      with:
        name: mysafetyreport-linux-${{ needs.prepare-release.outputs.version }}
        path: release-assets/linux

    - name: Download macOS x64 artifact
      uses: actions/download-artifact@v5
      with:
        name: mysafetyreport-macos-x64-${{ needs.prepare-release.outputs.version }}
        path: release-assets/macos-x64

    - name: Download macOS arm64 artifact
      uses: actions/download-artifact@v5
      with:
        name: mysafetyreport-macos-arm64-${{ needs.prepare-release.outputs.version }}
        path: release-assets/macos-arm64

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.prepare-release.outputs.tag }}
        name: "나만의 안전신문고 v${{ needs.prepare-release.outputs.version }}"
        body: |
          **나만의 안전신문고** v${{ needs.prepare-release.outputs.version }} 자동 릴리즈
          Commit: ${{ github.sha }}
        files: |
          release-assets/windows/mysafetyreport-win.zip
          release-assets/linux/mysafetyreport-linux.zip
          release-assets/macos-x64/mysafetyreport-macos-x64.zip
          release-assets/macos-arm64/mysafetyreport-macos-arm64.zip
        draft: false
        prerelease: false
        generate_release_notes: true

  # # ────────────────────────────────────────────────────────────────
  # # 5. Linux ARM64 실행 파일 빌드 (Docker 크로스컴파일, 235 러너)
