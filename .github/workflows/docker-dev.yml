name: Docker Dev

on:
  workflow_dispatch:

jobs:
  build-docker-dev:
    runs-on: [self-hosted, Linux, X64, 234]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Fix workspace permissions
      run: sudo chown -R $(id -u):$(id -g) . || true

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set lowercase image name and short SHA
      run: |
        echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker-container
        use: true

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image (amd64 + arm64) — dev tag only
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        # 공개 커뮤니티 설정(저장소 Variables, 비밀 아님)을 이미지의 /app/community_public.json 으로 굽는다. 없으면 빌드가 멈춘다.
        build-args: |
          COMMUNITY_SUPABASE_URL=${{ vars.LOCAL_SUPABASE_URL }}
          COMMUNITY_SUPABASE_PUBLISHABLE_KEY=${{ vars.LOCAL_SUPABASE_PUBLISHABLE_KEY }}
          COMMUNITY_SITE_URL=${{ vars.COMMUNITY_SITE_URL }}
          COMMUNITY_CONFIG_REQUIRED=1
        tags: |
          ghcr.io/${{ env.IMAGE_REPO }}:dev
          ghcr.io/${{ env.IMAGE_REPO }}:dev-${{ env.SHORT_SHA }}
          fentanest/safetyreport:dev
          fentanest/safetyreport:dev-${{ env.SHORT_SHA }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
