name: Build macOS Test

on:
  workflow_dispatch:
  push:
    branches:
      - mac

concurrency:
  group: build-macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Read build metadata
      id: meta
      run: |
        versionString=$(tr -d '[:space:]' < VERSION)
        if [ -z "$versionString" ]; then
          echo "::error::VERSION 파일에서 버전을 읽을 수 없습니다."
          exit 1
        fi
        echo "version=$versionString" >> "$GITHUB_OUTPUT"
        echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "Version: $versionString"
        echo "Commit: ${GITHUB_SHA::7}"

  build-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: intel
          runner: macos-15-intel
          zip_name: mysafetyreport-macos-intel-test.zip
        - name: arm64
          runner: macos-15
          zip_name: mysafetyreport-macos-arm64-test.zip

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Clean previous build artifacts
      run: rm -rf venv build dist

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Create virtual environment and install dependencies
      run: |
        python -m venv venv
        ./venv/bin/python -m pip install --no-cache-dir --upgrade pip
        ./venv/bin/pip install --no-cache-dir -r requirements.txt
        ./venv/bin/pip install --no-cache-dir pyinstaller

    - name: Build macOS executable with PyInstaller
      run: ./venv/bin/python scripts/build/build_exe.py

    - name: Ensure launchers are executable
      run: |
        chmod +x dist/mysafetyreport/mysafetyreport
        if [ -f dist/mysafetyreport/run.command ]; then
          chmod +x dist/mysafetyreport/run.command
        fi

    - name: Package macOS build into Zip
      run: |
        cd dist/mysafetyreport
        zip -r "../../${{ matrix.zip_name }}" .

    - name: Upload macOS test artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}-macos-test-v${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.short_sha }}
        path: ${{ matrix.zip_name }}
