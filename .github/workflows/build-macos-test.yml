name: Build macOS Test

on:
  workflow_dispatch:
  push:
    branches:
      - mac

concurrency:
  group: build-macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Read build metadata
      id: meta
      run: |
        versionString=$(tr -d '[:space:]' < VERSION)
        if [ -z "$versionString" ]; then
          echo "::error::VERSION 파일에서 버전을 읽을 수 없습니다."
          exit 1
        fi
        echo "version=$versionString" >> "$GITHUB_OUTPUT"
        echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        echo "Version: $versionString"
        echo "Commit: ${GITHUB_SHA::7}"

  build-macos:
    needs: prepare
    runs-on: [self-hosted, macOS, X64, 236]
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Clean previous build artifacts
      run: rm -rf venv build dist

    - name: Resolve Universal 2 Python
      id: python
      env:
        MACOS_UNIVERSAL2_PYTHON: ${{ vars.MACOS_UNIVERSAL2_PYTHON }}
        MACOS_UNIVERSAL2_PYTHON_FALLBACK: /Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14
      run: |
        set -euo pipefail

        PYTHON_BIN="${MACOS_UNIVERSAL2_PYTHON:-$MACOS_UNIVERSAL2_PYTHON_FALLBACK}"
        if [ ! -x "$PYTHON_BIN" ]; then
          echo "::error::Universal 2 Python을 찾지 못했습니다: $PYTHON_BIN"
          echo "::error::self-hosted macOS runner에 python.org universal2 Python 3.14를 설치하고, 필요하면 MACOS_UNIVERSAL2_PYTHON repository variable로 경로를 지정하세요."
          exit 1
        fi

        ARCHS=$(lipo -archs "$PYTHON_BIN")
        echo "Using Python: $PYTHON_BIN"
        echo "Architectures: $ARCHS"

        case "$ARCHS" in
          *x86_64*arm64*|*arm64*x86_64*)
            ;;
          *)
            echo "::error::선택한 Python이 universal2가 아닙니다: $ARCHS"
            exit 1
            ;;
        esac

        echo "python_bin=$PYTHON_BIN" >> "$GITHUB_OUTPUT"

    - name: Create virtual environment and install dependencies
      env:
        ARCHFLAGS: -arch x86_64 -arch arm64
      run: |
        "${{ steps.python.outputs.python_bin }}" -m venv venv
        ./venv/bin/python -m pip install --no-cache-dir --upgrade pip
        ./venv/bin/pip install --no-cache-dir -r requirements.txt
        ./venv/bin/pip install --no-cache-dir pyinstaller

    - name: Diagnose macOS Universal 2 Python environment
      run: |
        ./venv/bin/python scripts/build/check_macos_universal2.py \
          --root venv \
          --expected-arch x86_64 \
          --expected-arch arm64 \
          --fail-if-empty

    - name: Build macOS Universal 2 executable with PyInstaller
      env:
        ARCHFLAGS: -arch x86_64 -arch arm64
        PYINSTALLER_TARGET_ARCH: universal2
      run: ./venv/bin/python scripts/build/build_exe.py

    - name: Diagnose macOS Universal 2 bundle
      run: |
        ./venv/bin/python scripts/build/check_macos_universal2.py \
          --root dist/mysafetyreport \
          --expected-arch x86_64 \
          --expected-arch arm64 \
          --fail-if-empty

    - name: Ensure launchers are executable
      run: |
        chmod +x dist/mysafetyreport/mysafetyreport
        if [ -f dist/mysafetyreport/run.command ]; then
          chmod +x dist/mysafetyreport/run.command
        fi

    - name: Package macOS build into Zip
      run: |
        cd dist/mysafetyreport
        zip -r ../../mysafetyreport-macos-universal2-test.zip .

    - name: Upload macOS test artifact
      uses: actions/upload-artifact@v7
      with:
        name: macos-universal2-test-v${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.short_sha }}
        path: mysafetyreport-macos-universal2-test.zip
